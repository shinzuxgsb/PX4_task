/position_pid_controller:
  ros__parameters:
    control_frequency: 50.0
    pose_data_timeout_sec: 0.5
    map_frame: "map"
    laser_link_frame: "laser_link"

    height_min_cm: 0.0
    height_max_cm: 220.0
    height_filter_jump_threshold_cm: 35.0
    height_filter_required_frames: 5

    kp_xy: 0.8
    ki_xy: 0.0
    kd_xy: 0.2
    kp_yaw: 1.0
    ki_yaw: 0.0
    kd_yaw: 0.2
    kp_z: 1.0
    ki_z: 0.0
    kd_z: 0.2

    # The MAVLink bridge applies the same limits again as a final safety gate.
    max_linear_velocity: 24.0
    max_angular_velocity: 20.0
    max_vertical_velocity: 20.0

    # mavlink_bridge interprets /target_velocity as body FLU. The reference
    # controller computes world-frame velocity, so rotate it before publishing.
    velocity_output_frame: "body"

    visual_kp_x: 0.08
    visual_ki_x: 0.0
    visual_kd_x: 0.02
    visual_kp_y: 0.08
    visual_ki_y: 0.0
    visual_kd_y: 0.02
    visual_pixel_deadzone: 5.0
    visual_max_xy_velocity: 9.0
    visual_data_timeout_sec: 0.2
    failure_hold_vertical_velocity_cm_s: 5.0
