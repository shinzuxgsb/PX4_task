tf_to_odom:
  ros__parameters:
    # Cartographer 的 odom 系是「机体对齐的局部 FLU」，且不含回环修正（不回跳），
    # 天生适合做速度源。不要用 map 系——那里会被回环优化打出跳变。
    parent_frame: "odom"
    child_frame: "base_link"
    output_topic: "/odom_from_slam"

    sample_rate: 50.0          # TF 采样频率
    publish_rate: 30.0         # 里程计发布频率

    # --- 抗噪参数（台架实测：静止位姿抖动约 1 mm/帧 -> 等效速度噪声 1~1.5 cm/s）---
    # 2026-10-16 调参：实测"指令→实际速度"滞后 300~400ms，其中主要是这两个参数
    # 导致的测量滞后；窗从 0.2s 缩到 0.14s、α 从 0.25 提到 0.40，滞后约减半。
    # 代价是速度噪声略增（约 2cm/s），EKF 侧靠 odom_velocity_noise 声明。
    velocity_window_s: 0.14    # 时间窗差分，不要用相邻帧
    deadband_mps: 0.015        # 1.5 cm/s 以下判为静止（原来 2 cm/s）
    max_speed_mps: 1.0         # 超过判为回环/重定位跳变，本周期丢弃
    lowpass_alpha: 0.40        # 一阶低通（原 0.25 → 滞后小一半，噪声大一点）
    max_tf_age_s: 0.3          # TF 太旧就停止发布
