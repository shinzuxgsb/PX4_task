# 2026-10-14：NTP 源换成国内可用 + 缩短"置已同步位"的最短轮询间隔。
#
# 为什么要管这个：
#   px4-p2p-chain.service 原先 After=time-sync.target，而 systemd-time-wait-sync 要等
#   systemd-timesyncd 报"内核时钟已同步"。原配置是 systemd 编译默认（NTP= 空 ⇒ 走
#   ntp.ubuntu.com），实测本网络下经常超时：journal 里 17 分钟后还在
#     "Timed out waiting for reply from 185.125.190.56:123 (ntp.ubuntu.com)"
#   于是整条飞行链（雷达/SLAM/EV）被 NTP 应答速度卡住 —— 四次上电分别为
#   35.3 s / 35.6 s / 172.9 s / 283.1 s 才启动。
#   链路的硬依赖已在同一次改动里去掉（改成 run_p2p.sh 里的有界等待），本文件只是让
#   "时钟同步"自身也快起来，并顺带保护其它等 time-sync.target 的单元。
#
# 安装：
#   sudo mkdir -p /etc/systemd/timesyncd.conf.d
#   sudo cp 10-ntp-cn.conf /etc/systemd/timesyncd.conf.d/
#   sudo systemctl restart systemd-timesyncd
# 验证：
#   journalctl -u systemd-timesyncd -b --no-pager | tail -n 20
#   应出现 "Initial synchronization to time server <ip>:123 (ntp.aliyun.com)"
# 回滚：
#   sudo rm /etc/systemd/timesyncd.conf.d/10-ntp-cn.conf && sudo systemctl restart systemd-timesyncd
[Time]
NTP=ntp.aliyun.com
FallbackNTP=cn.pool.ntp.org ntp.ubuntu.com
# 默认 32 s ⇒ 时钟虽然已在校正，也要再等一整轮才会把"已同步"位置起来
# （实测 t=4.5 s 完成第一次校正，t=35.2 s 才 "Finished Wait Until Kernel Time Synchronized"）。
# 16 s 是 RFC 5905 建议的客户端最小轮询间隔，故取 16。
PollIntervalMinSec=16
